version: "3"
services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDPLATFORM=linux/amd64
    env_file:
      - .env
    ports:
      - 8080:8080
    entrypoint: ["/bin/sh", "docker-entrypoint.sh"]
    # command: ["sleep", "9999"]

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672

  redis:
    image: redis:8.2-rc1-alpine
    ports:
      - 6379:6379
    volumes: redis_data:/data

volumes:
  redis_data:
